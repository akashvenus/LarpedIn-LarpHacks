<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gift Reveal</title>
<style>
:root {
  --bg: #15151b;
  --surface: #20212a;
  --line: rgba(255,255,255,.12);
  --text: #f6f2e9;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  background: var(--bg);
  color: var(--text);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
.stage-wrap {
  width: min(460px, calc(100% - 32px));
  min-height: 430px;
  display: grid;
  place-items: center;
  border: 1px solid var(--line);
  border-radius: 20px;
  background: var(--surface);
  cursor: pointer;
}
.gift-screen {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  gap: 14px;
  padding: 20px 8px;
}
.gift-stage {
  position: relative;
  width: 170px;
  height: 170px;
  --lid-h: 50%;
  --wiggle-delay: 0s;
  --wiggle-dur: 0.7s;
  --lid-delay: 0.7s;
  --lid-dur: 1.3s;
  --fade-delay: 2.0s;
  --fade-dur: 0.5s;
}
.gift-part {
  position: absolute;
  left: 0;
  width: 100%;
  background-image: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20170%20170%22%3E%0A%20%20%3Crect%20width%3D%22170%22%20height%3D%22170%22%20fill%3D%22none%22/%3E%0A%20%20%3Crect%20x%3D%2232%22%20y%3D%2273%22%20width%3D%22106%22%20height%3D%2275%22%20rx%3D%228%22%20fill%3D%22%23D96B5F%22/%3E%0A%20%20%3Crect%20x%3D%2224%22%20y%3D%2257%22%20width%3D%22122%22%20height%3D%2228%22%20rx%3D%228%22%20fill%3D%22%23F07B6D%22/%3E%0A%20%20%3Crect%20x%3D%2276%22%20y%3D%2257%22%20width%3D%2218%22%20height%3D%2291%22%20fill%3D%22%23F3D36C%22/%3E%0A%20%20%3Cpath%20d%3D%22M85%2057%20C66%2035%2C%2048%2033%2C%2045%2045%20C43%2056%2C%2060%2061%2C%2085%2057Z%22%20fill%3D%22%23F3D36C%22/%3E%0A%20%20%3Cpath%20d%3D%22M85%2057%20C104%2035%2C%20122%2033%2C%20125%2045%20C127%2056%2C%20110%2061%2C%2085%2057Z%22%20fill%3D%22%23F3D36C%22/%3E%0A%20%20%3Cpath%20d%3D%22M85%2057%20C79%2045%2C%2078%2034%2C%2085%2029%20C92%2034%2C%2091%2045%2C%2085%2057Z%22%20fill%3D%22%23F7E59E%22/%3E%0A%3C/svg%3E");
  background-repeat: no-repeat;
  background-size: 100% auto;
}
.gift-body {
  top: var(--lid-h);
  height: calc(100% - var(--lid-h));
  background-position: 0 100%;
}
.gift-lid {
  top: 0;
  height: var(--lid-h);
  background-position: 0 0;
}
.gift-stage.run .gift-lid {
  animation:
    gift-wiggle var(--wiggle-dur) ease-in-out var(--wiggle-delay) both,
    gift-lid-off var(--lid-dur) cubic-bezier(0.34, 1.2, 0.64, 1) var(--lid-delay) both;
}
.gift-stage.run .gift-body {
  animation:
    gift-wiggle var(--wiggle-dur) ease-in-out var(--wiggle-delay) both,
    gift-fade-out var(--fade-dur) ease var(--fade-delay) both;
}
@keyframes gift-wiggle {
  0%, 100% { transform: rotate(0deg); }
  25% { transform: rotate(-3deg); }
  50% { transform: rotate(3deg); }
  75% { transform: rotate(-2deg); }
}
@keyframes gift-lid-off {
  0% { transform: translateY(0) rotate(0deg); opacity: 1; }
  20% { transform: translateY(5px) rotate(2deg); }
  60% { transform: translateY(-120px) rotate(-14deg); opacity: 1; }
  100% { transform: translateY(-160px) rotate(-20deg); opacity: 0; }
}
@keyframes gift-fade-out {
  0% { opacity: 1; transform: translateY(0) scale(1); }
  100% { opacity: 0; transform: translateY(10px) scale(0.95); }
}
.gift-glow {
  position: absolute;
  inset: -24px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255, 209, 102, 0.5), transparent 70%);
  opacity: 0;
  transform: scale(0.6);
  pointer-events: none;
}
.gift-stage.glow .gift-glow {
  animation: glow-in 0.6s ease both;
}
@keyframes glow-in {
  from { opacity: 0; transform: scale(0.6); }
  to { opacity: 1; transform: scale(1); }
}
.gift-copy {
  opacity: 0;
  transform: translateY(14px);
  transition: opacity 0.5s ease, transform 0.5s ease;
}
.gift-copy.show {
  opacity: 1;
  transform: translateY(0);
}
.gift-copy h2 {
  margin: 0;
  font-size: 26px;
  font-weight: 700;
}
.hint {
  position: fixed;
  bottom: 18px;
  color: rgba(255,255,255,.45);
  font-size: 12px;
}
</style>
</head>
<body>
  <div class="stage-wrap" id="replayArea">
    <div class="gift-screen">
      <div class="gift-stage" id="giftStage" aria-label="Animated gift">
        <div class="gift-glow"></div>
        <div class="gift-part gift-body"></div>
        <div class="gift-part gift-lid"></div>
      </div>
      <div class="gift-copy" id="giftCopy">
        <h2>You got a surprise</h2>
      </div>
    </div>
  </div>
  <div class="hint">Click anywhere on the card to replay</div>

<script>
const stage = document.getElementById('giftStage');
const copy = document.getElementById('giftCopy');
const replayArea = document.getElementById('replayArea');

function cssSeconds(name) {
  return parseFloat(getComputedStyle(stage).getPropertyValue(name)) || 0;
}

function replayGift() {
  stage.classList.remove('run', 'glow');
  copy.classList.remove('show');
  void stage.offsetWidth;

  stage.classList.add('run');

  const glowAt = Math.max(
    0.1,
    cssSeconds('--lid-delay') + cssSeconds('--lid-dur') * 0.45
  );

  const copyAt = Math.max(
    cssSeconds('--fade-delay') + cssSeconds('--fade-dur') * 0.65,
    cssSeconds('--lid-delay') + cssSeconds('--lid-dur') * 0.8
  );

  setTimeout(() => stage.classList.add('glow'), glowAt * 1000);
  setTimeout(() => copy.classList.add('show'), copyAt * 1000);
  // Contract signal for the host app (LarpedIn GiftReveal): one message
  // per play, a beat after the copy lands. The host also has a fallback
  // timer, so a missing signal can never strand the demo.
  setTimeout(() => parent.postMessage({ type: 'gift-done' }, '*'), (copyAt + 1.1) * 1000);
}

replayArea.addEventListener('click', replayGift);
replayGift();
</script>
</body>
</html>
